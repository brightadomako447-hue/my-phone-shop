
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Phone Shop</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 24px auto; padding: 16px; background: #f5f6f8; color: #222; }
    h1 { color: #173b67; }
    section { background: white; padding: 18px; border-radius: 12px; margin: 16px 0; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; margin: 7px 0; font-size: 16px; }
    button { background: #173b67; color: white; border: 0; border-radius: 7px; }
    .phone { border-top: 1px solid #ddd; padding: 12px 0; overflow-wrap: anywhere; }
    #message { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>My Phone Shop</h1>
  <p>Phone stock · Ghana cedis (GHS)</p>

  <section id="login">
    <h2>Sign in</h2>
    <input id="email" type="email" placeholder="Your email address">
    <input id="password" type="password" placeholder="Your password">
    <button id="signIn">Sign in</button>
  </section>

  <div id="app" hidden>
    <section>
      <h2>Add a phone</h2>
      <form id="phoneForm">
        <input id="imei" placeholder="15-digit IMEI" inputmode="numeric" maxlength="15" required>
        <input id="brand" placeholder="Brand (e.g. Apple)" required>
        <input id="model" placeholder="Model (e.g. iPhone 15)" required>
        <input id="cost" type="number" min="0" step="0.01" placeholder="Purchase cost (GHS)" required>
        <input id="price" type="number" min="0" step="0.01" placeholder="Selling price (GHS)" required>
        <button type="submit">Save phone</button>
      </form>
    </section>

    <section>
      <h2>Search phone stock</h2>
      <input id="search" placeholder="Search by IMEI, brand or model">
      <button id="searchButton">Search</button>
      <div id="stock"></div>
    </section>
    <button id="signOut">Sign out</button>
    
<section>
  <h2>Add a Dealer</h2>
  <form id="dealerForm">
    <input id="dealerName" placeholder="Dealer name" required>
    <input id="dealerPhone" placeholder="Dealer phone number" required>
    <input id="dealerNotes" placeholder="Address or notes">
    <button type="submit">Save Dealer</button>
  </form>
  <div id="dealerList"></div>
<section>
  <h2>Add a Customer</h2>
  <form id="customerForm">
    <input id="customerName" placeholder="Customer name" required>
    <input id="customerPhone" placeholder="Customer phone number" required>
    <input id="customerNotes" placeholder="Address or notes">
    <button type="submit">Save Customer</button>
  </form>
  <div id="customerList"></div>
</section>

</section>

  </div>
  <p id="message"></p>

  <script>
    const SUPABASE_URL = "https://adogjxpztzhrwsuzyuvt.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7K0yrEV8vjTsjB6ICZW8yQ_O72gWa03";

    const db = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
    );
    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
    }

    async function refreshPage() {
      const { data: { session } } = await db.auth.getSession();
      document.getElementById("login").hidden = !!session;
      document.getElementById("app").hidden = !session;
      if (session) await loadStock();
    }

    document.getElementById("signIn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      showMessage("Signing in...");
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) return showMessage("Sign-in failed: " + error.message);
      showMessage("Signed in.");
      await refreshPage();
    };

    document.getElementById("signOut").onclick = async () => {
      await db.auth.signOut();
      document.getElementById("stock").replaceChildren();
      showMessage("Signed out.");
      await refreshPage();
    };

    document.getElementById("phoneForm").onsubmit = async (event) => {
      event.preventDefault();
      const imei = document.getElementById("imei").value.trim();
      if (!/^\d{15}$/.test(imei)) {
        return showMessage("Please enter a 15-digit IMEI.");
      }

      const { data: { user } } = await db.auth.getUser();
      if (!user) return showMessage("Please sign in again.");

      const phone = {
        owner_id: user.id,
        imei,
        brand: document.getElementById("brand").value.trim(),
        model: document.getElementById("model").value.trim(),
        purchase_cost: Number(document.getElementById("cost").value),
        selling_price: Number(document.getElementById("price").value),
        status: "in_stock"
      };

      showMessage("Saving phone...");
      const { error } = await db.from("shop_phones").insert(phone);
      if (error) return showMessage("Could not save: " + error.message);

      event.target.reset();
      showMessage("Phone saved successfully.");
      await loadStock();
    };

    async function loadStock() {
      const term = document.getElementById("search").value.trim();
      let query = db.from("shop_phones")
        .select("imei,brand,model,purchase_cost,selling_price,status,created_at")
        .order("created_at", { ascending: false });

      if (term) {
        const safeTerm = term.replace(/[,%()]/g, "");
        query = query.or(
          "imei.ilike.%" + safeTerm + "%," +
          "brand.ilike.%" + safeTerm + "%," +
          "model.ilike.%" + safeTerm + "%"
        );
      }

      const { data, error } = await query;
      const stock = document.getElementById("stock");
      stock.replaceChildren();

      if (error) {
        showMessage("Could not load stock: " + error.message);
        return;
      }
      if (!data.length) {
        stock.textContent = "No phones found.";
        return;
      }

      data.forEach(phone => {
        const item = document.createElement("div");
        item.className = "phone";
        item.textContent =
          phone.brand + " " + phone.model +
          "\nIMEI: " + phone.imei +
          "\nPurchase: GHS " + Number(phone.purchase_cost).toFixed(2) +
          "\nSelling: GHS " + Number(phone.selling_price).toFixed(2) +
          "\nStatus: " + phone.status;
        stock.appendChild(item);
      });
      showMessage("Stock loaded: " + data.length + " phone(s).");
    }

    document.getElementById("searchButton").onclick = loadStock;
    document.getElementById("search").onkeydown = event => {
      if (event.key === "Enter") {
        event.preventDefault();
        loadStock();
      }
    };

    db.auth.onAuthStateChange(() => {
      setTimeout(refreshPage, 0);
    });
    refreshPage();
    
    document.getElementById("dealerForm").onsubmit = async (event) => {
      event.preventDefault();

      const { data: { user }, error: userError } = await db.auth.getUser();
      if (userError || !user) {
        showMessage("Please sign in again.");
        return;
      }

      const dealer = {
        owner_id: user.id,
        name: document.getElementById("dealerName").value.trim(),
        phone: document.getElementById("dealerPhone").value.trim(),
        notes: document.getElementById("dealerNotes").value.trim()
      };

      showMessage("Saving dealer...");

      const { error } = await db.from("shop_dealers").insert(dealer);

      if (error) {
        showMessage("Could not save dealer: " + error.message);
        return;
      }

      document.getElementById("dealerForm").reset();
      showMessage("Dealer saved successfully!");
    };
    
    document.getElementById("customerForm").onsubmit = async (event) => {
      event.preventDefault();

      const { data: { user }, error: userError } = await db.auth.getUser();

      if (userError || !user) {
        showMessage("Please sign in again.");
        return;
      }

      const customer = {
        owner_id: user.id,
        name: document.getElementById("customerName").value.trim(),
        phone: document.getElementById("customerPhone").value.trim(),
        notes: document.getElementById("customerNotes").value.trim()
      };

      showMessage("Saving customer...");

      const { error } = await db.from("shop_customers").insert(customer);

      if (error) {
        showMessage("Could not save customer: " + error.message);
        return;
      }

      document.getElementById("customerForm").reset();
      showMessage("Customer saved successfully!");
    };

    async function loadPeople() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) return;

      const dealerList = document.getElementById("dealerList");
      const customerList = document.getElementById("customerList");

      const { data: dealers, error: dealerError } = await db
        .from("shop_dealers")
        .select("name, phone, notes")
        .order("name");

      if (dealerError) {
        dealerList.textContent = "Could not load dealers.";
      } else {
        dealerList.replaceChildren();
        const heading = document.createElement("h3");
        heading.textContent = "Saved Dealers";
        dealerList.appendChild(heading);

        if (!dealers || dealers.length === 0) {
          dealerList.append("No dealers saved yet.");
        } else {
          dealers.forEach((dealer) => {
            const item = document.createElement("p");
            item.textContent =
              dealer.name + " — " + dealer.phone +
              (dealer.notes ? " — " + dealer.notes : "");
            dealerList.appendChild(item);
          });
        }
      }

      const { data: customers, error: customerError } = await db
        .from("shop_customers")
        .select("name, phone, notes")
        .order("name");

      if (customerError) {
        customerList.textContent = "Could not load customers.";
      } else {
        customerList.replaceChildren();
        const heading = document.createElement("h3");
        heading.textContent = "Saved Customers";
        customerList.appendChild(heading);

        if (!customers || customers.length === 0) {
          customerList.append("No customers saved yet.");
        } else {
          customers.forEach((customer) => {
            const item = document.createElement("p");
            item.textContent =
              customer.name + " — " + customer.phone +
              (customer.notes ? " — " + customer.notes : "");
            customerList.appendChild(item);
          });
        }
      }
    }

    db.auth.onAuthStateChange((event, session) => {
      if (session) {
        setTimeout(() => loadPeople(), 0);
      }
    });

 </script>
</body>
</html>
